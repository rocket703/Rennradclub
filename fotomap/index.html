<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Fotomap des Radsportclub Magdeburg e.V.">
  <title>Fotomap | Radsportclub Magdeburg e.V.</title>

  <link rel="stylesheet" href="./assets/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/" aria-label="Zur Startseite des Radsportclub Magdeburg">
      <span class="brand-mark" aria-hidden="true">RCM</span>
      <span>
        <strong>Fotomap</strong>
        <small>Radsportclub Magdeburg e.V.</small>
      </span>
    </a>

    <div class="actions">
      <label class="button button-primary" for="gpxInput">GPX anzeigen</label>
      <input id="gpxInput" type="file" accept=".gpx,application/gpx+xml" multiple>
      <button class="button button-secondary" id="clearGpxButton" type="button">GPX entfernen</button>
    </div>

    <div id="status" class="status" role="status" aria-live="polite">Fotomap wird geladen …</div>
  </header>

  <main class="map-shell">
    <div id="map" aria-label="Fotokarte"></div>
  </main>

  <script src="../consent.js"></script>
  <script src="./assets/app.js"></script>
</body>
</html>
